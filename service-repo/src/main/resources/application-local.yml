spring:
  config:
    activate:
      on-profile: local
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:service_db}
    username: ${DB_USER:service_user}
    password: ${DB_PASSWORD:service_password}
  jpa:
    hibernate:
      ddl-auto: update
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
    show-sql: true
  sql:
    init:
      mode: always
      data-locations: classpath:db/local/data.sql
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${JWT_ISSUER_URI:http://localhost:8081/realms/reusable-realm}

# Cache provider: 'redis' (default) or 'local' (in-memory, no Redis needed)
app:
  cache:
    provider: ${CACHE_PROVIDER:redis}

logging:
  level:
    com.example.platform.service.service: DEBUG
    com.example.platform.service.config: DEBUG
